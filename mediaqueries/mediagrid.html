<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width:100vw;
            height:100vh;
            margin: 25px;
            gap:20px;
            display: grid;
            justify-content: space-evenly;
            grid-template-columns: repeat(3, 1fr);}
            .card{
                width: 400px;
                height: 400px;
                border: 2px solid #ff0000;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            @media (max-width: 768px) {
                .grid-container {
                    width: 100%;
                    height: auto;
                    margin: 0;
                    padding: 16px;
                    box-sizing: border-box;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 16px;
                }

                .card {
                    width: 100%;
                    height: auto;
                }
            }

            @media (max-width: 600px) {
                .grid-container {
                    grid-template-columns: 1fr;
                }

                .card {
                    max-width: 400px;
                    margin: 0 auto;
                }
            }
    </style>
</head>
<body>
    <div class="grid-container" ;">
       <div class="card">
            <img src="assests/img1.jpg" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img2.jpg" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img3.png" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img4.jpg" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img5.png" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img6.png" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img7.png" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img8.png" alt="Shobhit">
        </div>
        <div class="card">
            <img src="assests/img9.png" alt="Shobhit">
        </div>

    </div>
</body>
</html>
