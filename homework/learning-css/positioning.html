<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: fixed;
            inset: 0;
        }
        .topleft {
            position: absolute;
            top: 0px;
            left: 0px;
            color: red;
            font-size: 30px;
        }
        .topcenter {
            position: absolute;
            top: 0px;
            width: 100%;
            text-align: center;
            color: red;
            font-size: 30px;
        }
        .topright {
            position: absolute;
            top: 0px;
            right: 0px;
            color: red;
            font-size: 30px;
        }
        .centerleft {
            position: absolute;
            top: calc(50% - 15px);
            left: 0px;
            color: red;
            font-size: 30px;
        }
        .center {
            position: absolute;
            top: calc(50% - 15px);
            width: 100%;
            text-align: center;
            color: red;
            font-size: 30px;
        }
        .centerright {
            position: absolute;
            top: calc(50% - 15px);
            right: 0px;
            color: red;
            font-size: 30px;
        }
        .bottomleft {
            position: absolute;
            bottom: 0px;
            left: 0px;
            color: red;
            font-size: 30px;
        }
        .bottomcenter {
            position: absolute;
            bottom: 0px;
            width: 100%;
            text-align: center;
            color: red;
            font-size: 30px;
        }
        .bottomright {
            position: absolute;
            bottom: 0px;
            right: 0px;
            color: red;
            font-size: 30px;
        }




    </style>
</head>
<body>
    <div class="container">
        <img src="photo.jpg" alt="image"  width="100%">
    <div class="topleft">Shobhit</div> 
    <div class="topright">Shobhit</div>
    <div class="bottomleft">Shobhit</div>
    <div class="bottomright">Shobhit</div>
    <div class="centerleft">Shobhit</div>
    <div class="centerright">Shobhit</div>
    <div class="topcenter">Shobhit</div>
    <div class="bottomcenter">Shobhit</div>
    <div class="center">Shobhit</div>
    </div>
    
</body>
</html>
